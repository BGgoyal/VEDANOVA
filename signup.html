<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VedaNova - Sign Up</title>
    <link rel="stylesheet" href="styles.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Specific styles for the login/signup page - copy from login.html for consistency */
        body {
            background-color: #e0f2f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 121, 107, 0.2);
            width: 100%;
            max-width: 450px; /* Slightly wider for more fields */
            text-align: center;
        }
        .login-container h2 {
            color: var(--primary-color);
            margin-bottom: 30px;
            font-size: 2em;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        .login-container .btn-primary {
            width: 100%;
            padding: 12px;
            font-size: 1.1em;
            margin-top: 10px;
        }
        .switch-link {
            margin-top: 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo" style="margin-bottom: 20px;">VedaNova 🕊️</div>
        <h2>Create Your VedaNova Account</h2>
        <form action="dashboard.html" method="POST">
             <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Dr. Riya Sharma">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="qualification">Qualification</label>
                <select id="qualification" name="qualification" required>
                    <option value="">Select Qualification</option>
                    <option value="BAMS">BAMS</option>
                    <option value="MD_Ayurveda">MD (Ayurveda)</option>
                    <option value="MSc_Nutrition">M.Sc. Nutrition (Ayurveda Specialization)</option>
                    <option value="other">Other Ayurvedic Practitioner</option>
                </select>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Create a strong password">
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
        <div class="switch-link">
            Already have an account? <a href="login.html" style="color: var(--primary-color); text-decoration: none;">Login here</a>
        </div>
    </div>

</body>
</html>
